name: Feature request
description: Suggest an improvement or new capability for MarkdStage.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve MarkdStage.
        Please search existing issues before submitting a new request.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What problem would this feature solve, and who would benefit from it?
      placeholder: Describe the user need or limitation.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Describe the behavior or experience you would like to see.
      placeholder: Explain your proposed approach.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions or workarounds you have considered.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add examples, links, mockups, or other context that may help.
