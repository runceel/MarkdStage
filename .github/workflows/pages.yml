name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/brand/**"
      - "assets/readme/**"
      - "scripts/build-site.mjs"
      - "scripts/serve-site.mjs"
      - "test/site/**"
      - "playwright.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "assets/brand/**"
      - "assets/readme/**"
      - "scripts/build-site.mjs"
      - "scripts/serve-site.mjs"
      - "test/site/**"
      - "playwright.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and check site
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --init --ipc=host
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Read existing Pages configuration
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: false

      - name: Build static site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url || 'http://localhost:4173/MarkdStage/' }}
        run: npm run build:site

      - name: Site regression and accessibility
        run: npm run test:site

      - name: Documentation links
        run: npm run test:docs

      - name: Save failure reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: site-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload checked site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
