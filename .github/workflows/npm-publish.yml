name: Release MarkdStage

on:
  push:
    tags:
      - "v*"
      - "!v*-recovery"
  workflow_dispatch:
    inputs:
      product_tag:
        description: Immutable product release tag to publish
        required: true
        type: string
  workflow_call:
    inputs:
      product_tag:
        description: Immutable product release tag to publish
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      release_sha: ${{ steps.release.outputs.sha }}
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --init --ipc=host
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.product_tag || github.ref_name }}
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: Verify version, tag, and release links
        id: release
        shell: bash
        env:
          PRODUCT_TAG: ${{ inputs.product_tag || github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/markdstage-cli/package.json').version")
          vscode_version=$(node -p "require('./packages/markdstage-vscode/package.json').version")
          if [ "$vscode_version" != "$version" ]; then
            echo "VS Code extension version $vscode_version does not match product version $version."
            exit 1
          fi
          stable_semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$version" =~ $stable_semver ]]; then
            echo "Package version $version is not a stable MAJOR.MINOR.PATCH version."
            exit 1
          fi
          expected="v${version}"
          if [ "${version%%.*}" -lt 4 ]; then
            echo "This source implements the v4 Desktop package set; do not publish it as a pre-v4 release."
            exit 1
          fi
          if [ "$PRODUCT_TAG" != "$expected" ]; then
            echo "Tag $PRODUCT_TAG does not match the unified product version $version."
            echo "Expected tag: $expected"
            exit 1
          fi
          case "$GITHUB_EVENT_NAME" in
            push)
              if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "$PRODUCT_TAG" ]; then
                echo "A push release must run directly from its product tag."
                exit 1
              fi
              ;;
            workflow_dispatch|workflow_call)
              if [ "$GITHUB_REF_TYPE" != "tag" ] ||
                [ "$GITHUB_REF_NAME" != "${PRODUCT_TAG}-recovery" ]; then
                echo "Recovery runs must execute from the matching ${PRODUCT_TAG}-recovery tag."
                exit 1
              fi
              ;;
            *)
              echo "Unsupported release event: $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin main --tags
          product_sha=$(git rev-parse "refs/tags/${PRODUCT_TAG}^{commit}")
          checked_out_sha=$(git rev-parse HEAD)
          if [ "$checked_out_sha" != "$product_sha" ]; then
            echo "Checkout $checked_out_sha does not match $PRODUCT_TAG ($product_sha)."
            exit 1
          fi
          git merge-base --is-ancestor "$product_sha" origin/main || {
            echo "The product-tag commit must be reachable from origin/main."
            exit 1
          }
          for readme in README.md README.ja.md; do
            release_link_count=$(grep -Fc "releases/tag/${PRODUCT_TAG}" "$readme")
            test "$release_link_count" -ge 1 || {
              echo "$readme must link to the current release $PRODUCT_TAG."
              exit 1
            }
            grep -F "tree/${PRODUCT_TAG}/.github/markdstage-dist" "$readme"
          done
          notes=".github/release-notes/${PRODUCT_TAG}.md"
          test -f "$notes" || {
            echo "Missing release notes: $notes"
            exit 1
          }
          grep -qx '## Overview' "$notes"
          grep -qx '## Compatibility and migration' "$notes"
          echo "tag=$PRODUCT_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$product_sha" >> "$GITHUB_OUTPUT"

      - name: Verify successful CI for release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          successful_runs=$(
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${PRODUCT_SHA}&status=success&event=push&branch=main&per_page=1" |
              node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data).total_count));"
          )
          if [ "$successful_runs" -lt 1 ]; then
            echo "The product-tag commit must have a successful main-branch CI run before release."
            echo "Commit: $PRODUCT_SHA"
            exit 1
          fi

      - name: Verify the Extension has no runtime npm dependencies
        shell: bash
        run: |
          set -euo pipefail
          found=$(find .github/extensions/markdstage \
            \( -name package.json -o -name package-lock.json -o -name node_modules \) -print)
          if [ -n "$found" ]; then
            echo "The Extension directory contains npm dependencies:"
            echo "$found"
            exit 1
          fi

      - name: Verify the published Awesome Copilot plugin tree
        # awesome-copilot pins this tag and its commit SHA, so the committed plugin tree must be
        # synchronized with the canonical Extension before the tag exists.
        run: npm run awesome:check

  extension:
    name: Package Extension
    needs: validate
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      PRODUCT_SHA: ${{ needs.validate.outputs.release_sha }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.release_sha }}

      - name: Create Extension ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets extension-stage
          cp -a .github/markdstage-dist extension-stage/markdstage
          rm -rf \
            extension-stage/markdstage/test \
            extension-stage/markdstage/test-results \
            extension-stage/markdstage/playwright-report \
            extension-stage/markdstage/node_modules
          rm -f \
            extension-stage/markdstage/package.json \
            extension-stage/markdstage/package-lock.json
          (
            cd extension-stage
            zip -q -r "../release-assets/markdstage-${RELEASE_TAG}.zip" markdstage
          )
          (
            cd release-assets
            sha256sum "markdstage-${RELEASE_TAG}.zip" \
              > "markdstage-${RELEASE_TAG}.zip.sha256"
          )
          unzip -Z1 "release-assets/markdstage-${RELEASE_TAG}.zip" \
            > release-assets/extension-contents.txt
          for required in \
            markdstage/copilot-extension.json \
            markdstage/extension.mjs \
            markdstage/scripts/vendor-assets.mjs \
            markdstage/schema/architecture-v1.schema.json \
            markdstage/vendor/mermaid.min.js.gz.part-0001; do
            grep -qx "$required" release-assets/extension-contents.txt || {
              echo "Missing from Extension ZIP: $required"
              exit 1
            }
          done
          if grep -Eq '^markdstage/(test/|node_modules/|package(-lock)?\.json$)' \
            release-assets/extension-contents.txt; then
            echo "The Extension ZIP contains development-only files."
            exit 1
          fi
          rm release-assets/extension-contents.txt

      - name: Upload Extension artifacts
        uses: actions/upload-artifact@v5
        with:
          name: markdstage-extension-release
          path: release-assets/*
          retention-days: 7
          if-no-files-found: error

  desktop:
    name: Package Desktop
    needs: validate
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      PRODUCT_SHA: ${{ needs.validate.outputs.release_sha }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.release_sha }}

      - name: .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: WinApp CLI
        shell: pwsh
        run: |
          if (-not (Get-Command winapp -ErrorAction SilentlyContinue)) {
            winget install --id Microsoft.WinAppCli --version 0.6.1 --exact --silent --accept-package-agreements --accept-source-agreements
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          winapp --version

      - name: Core tests
        run: dotnet test apps\MarkdStage.Desktop\tests\MarkdStage.Core.Tests\MarkdStage.Core.Tests.csproj -c Release

      - name: WinUI build
        run: dotnet build apps\MarkdStage.Desktop\src\MarkdStage.App\MarkdStage.App.csproj -c Release -r win-x64 -p:Platform=x64

      - name: Read package identity
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content `
            apps\MarkdStage.Desktop\src\MarkdStage.App\Package.appxmanifest -Raw
          $identity = $manifest.Package.Identity
          if ([string]::IsNullOrWhiteSpace($identity.Name) -or
              [string]::IsNullOrWhiteSpace($identity.Publisher)) {
            throw "Package.appxmanifest must define Identity Name and Publisher."
          }
          "MARKDSTAGE_PACKAGE_NAME=$($identity.Name)" >> $env:GITHUB_ENV
          "MARKDSTAGE_PACKAGE_PUBLISHER=$($identity.Publisher)" >> $env:GITHUB_ENV

      - name: x64 portable Windows package
        shell: pwsh
        run: apps\MarkdStage.Desktop\scripts\Publish.ps1 -Architecture x64 -Format Archive

      - name: ARM64 portable Windows package
        shell: pwsh
        run: apps\MarkdStage.Desktop\scripts\Publish.ps1 -Architecture arm64 -Format Archive

      - name: Prepare release signing certificate
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.MARKDSTAGE_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MARKDSTAGE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD)) {
            throw "Configure the documented release-signing certificate secrets."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "MarkdStage-release.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $certificatePath,
            $env:SIGNING_CERTIFICATE_PASSWORD,
            [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
          if ($certificate.Subject -ne $env:MARKDSTAGE_PACKAGE_PUBLISHER) {
            throw "The signing certificate subject must match Package.appxmanifest Publisher."
          }
          New-Item -ItemType Directory -Path apps\MarkdStage.Desktop\artifacts -Force | Out-Null
          $certificateOutput = "apps\MarkdStage.Desktop\artifacts\MarkdStage.cer"
          [IO.File]::WriteAllBytes(
            $certificateOutput,
            $certificate.Export(
              [Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          $hash = (Get-FileHash $certificateOutput -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MarkdStage.cer" |
            Set-Content "$certificateOutput.sha256" -Encoding ascii
          "MARKDSTAGE_CERTIFICATE_PATH=$certificatePath" >> $env:GITHUB_ENV

      - name: x64 signed release package
        shell: pwsh
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.MARKDSTAGE_SIGNING_CERTIFICATE_PASSWORD }}
        run: apps\MarkdStage.Desktop\scripts\Publish.ps1 -Architecture x64 -CertificatePath $env:MARKDSTAGE_CERTIFICATE_PATH -CertificatePassword $env:CERTIFICATE_PASSWORD -PackageName $env:MARKDSTAGE_PACKAGE_NAME -Publisher $env:MARKDSTAGE_PACKAGE_PUBLISHER -Version "$($env:RELEASE_TAG.TrimStart('v')).0"

      - name: ARM64 signed release package
        shell: pwsh
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.MARKDSTAGE_SIGNING_CERTIFICATE_PASSWORD }}
        run: apps\MarkdStage.Desktop\scripts\Publish.ps1 -Architecture arm64 -CertificatePath $env:MARKDSTAGE_CERTIFICATE_PATH -CertificatePassword $env:CERTIFICATE_PASSWORD -PackageName $env:MARKDSTAGE_PACKAGE_NAME -Publisher $env:MARKDSTAGE_PACKAGE_PUBLISHER -Version "$($env:RELEASE_TAG.TrimStart('v')).0"

      - name: Verify release package signatures
        shell: pwsh
        run: |
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            "apps\MarkdStage.Desktop\artifacts\MarkdStage.cer")
          foreach ($architecture in @("x64", "arm64")) {
            $package = "apps\MarkdStage.Desktop\artifacts\MarkdStage-win-$architecture.msix"
            $signature = Get-AuthenticodeSignature $package
            if (-not $signature.SignerCertificate -or
                $signature.SignerCertificate.Thumbprint -ne $certificate.Thumbprint) {
              throw "$architecture MSIX is not signed by the release certificate."
            }
          }

      - name: Remove release signing certificate
        if: always()
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "MarkdStage-release.pfx"
          Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue

      - name: Upload Desktop artifacts
        uses: actions/upload-artifact@v5
        with:
          name: markdstage-desktop-release
          path: |
            apps/MarkdStage.Desktop/artifacts/MarkdStage-win-x64.zip
            apps/MarkdStage.Desktop/artifacts/MarkdStage-win-x64.zip.sha256
            apps/MarkdStage.Desktop/artifacts/MarkdStage-win-arm64.zip
            apps/MarkdStage.Desktop/artifacts/MarkdStage-win-arm64.zip.sha256
            apps/MarkdStage.Desktop/artifacts/MarkdStage-win-x64.msix
            apps/MarkdStage.Desktop/artifacts/MarkdStage-win-x64.msix.sha256
            apps/MarkdStage.Desktop/artifacts/MarkdStage-win-arm64.msix
            apps/MarkdStage.Desktop/artifacts/MarkdStage-win-arm64.msix.sha256
            apps/MarkdStage.Desktop/artifacts/MarkdStage.cer
            apps/MarkdStage.Desktop/artifacts/MarkdStage.cer.sha256
          retention-days: 7
          if-no-files-found: error

  vscode:
    name: Package VS Code extension
    needs: validate
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      PRODUCT_SHA: ${{ needs.validate.outputs.release_sha }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.release_sha }}

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: Install dependencies
        working-directory: packages/markdstage-vscode
        run: npm ci

      - name: Test and package extension
        working-directory: packages/markdstage-vscode
        run: |
          set -euo pipefail
          npm test
          npm run build
          npm run package

      - name: Prepare release asset
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/markdstage-vscode/package.json').version")
          source=$(find packages/markdstage-vscode -maxdepth 2 -type f -name '*.vsix' -print -quit)
          test -n "$source" || {
            echo "The VS Code extension package was not produced."
            exit 1
          }
          mkdir -p release-assets
          target="release-assets/markdstage-vscode-${version}.vsix"
          cp "$source" "$target"
          (
            cd release-assets
            sha256sum "markdstage-vscode-${version}.vsix" \
              > "markdstage-vscode-${version}.vsix.sha256"
          )

      - name: Upload VS Code extension artifacts
        uses: actions/upload-artifact@v5
        with:
          name: markdstage-vscode-release
          path: release-assets/*
          retention-days: 7
          if-no-files-found: error

  npm:
    name: Publish npm package
    needs: [validate, desktop, vscode]
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      PRODUCT_SHA: ${{ needs.validate.outputs.release_sha }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.release_sha }}

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/

      - name: npm with Trusted Publishing support
        run: npm install --global npm@11.6.3

      - name: Review package contents
        working-directory: packages/markdstage-cli
        run: npm pack --dry-run

      - name: Create CLI release tarball
        shell: bash
        working-directory: packages/markdstage-cli
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          mkdir -p "$GITHUB_WORKSPACE/release-assets"
          npm pack --pack-destination "$GITHUB_WORKSPACE/release-assets"
          cd "$GITHUB_WORKSPACE/release-assets"
          sha256sum "markdstage-markdstage-${version}.tgz" \
            > "markdstage-markdstage-${version}.tgz.sha256"

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v5
        with:
          name: markdstage-cli-release
          path: release-assets/*
          retention-days: 7
          if-no-files-found: error

      - name: Publish package
        shell: bash
        working-directory: packages/markdstage-cli
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "Recovery runs verify the existing npm publication and never republish it."
            exit 0
          fi
          if npm view "@markdstage/markdstage@${version}" version \
            --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "@markdstage/markdstage@$version is already published."
          else
            npm publish --access public --provenance
          fi

      - name: Verify published version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/markdstage-cli/package.json').version")
          metadata_file="$RUNNER_TEMP/markdstage-npm-metadata.json"
          metadata_url="https://registry.npmjs.org/@markdstage%2fmarkdstage/${version}"
          for attempt in {1..60}; do
            if curl -fsSL "$metadata_url" -o "$metadata_file" &&
              node -e '
                const fs = require("node:fs");
                const metadata = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                if (metadata.version !== process.argv[2] ||
                    metadata.gitHead !== process.argv[3] ||
                    !metadata.dist?.integrity?.startsWith("sha512-") ||
                    !metadata.dist?.tarball ||
                    !metadata.dist?.attestations?.url) {
                  process.exit(1);
                }
              ' "$metadata_file" "$version" "$PRODUCT_SHA"; then
              echo "Verified @markdstage/markdstage@$version metadata for $PRODUCT_SHA."
              exit 0
            fi
            echo "Waiting for npm registry propagation ($attempt/60)..."
            sleep 10
          done
          echo "Published version $version was not visible after 10 minutes."
          exit 1

      - name: Verify published npm bytes and provenance
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/markdstage-cli/package.json').version")
          metadata_file="$RUNNER_TEMP/markdstage-npm-metadata.json"
          tarball="release-assets/markdstage-markdstage-${version}.tgz"
          test -f "$tarball"
          mapfile -t metadata < <(node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            console.log(data.dist.integrity);
            console.log(data.dist.tarball);
            console.log(data.dist.attestations.url);
          ' "$metadata_file")
          integrity=${metadata[0]}
          registry_tarball=${metadata[1]}
          attestations_url=${metadata[2]}
          local_integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          if [ "$local_integrity" != "$integrity" ]; then
            echo "The packaged npm tarball does not match the published registry integrity."
            exit 1
          fi
          curl -fsSL "$registry_tarball" -o "$RUNNER_TEMP/markdstage-published.tgz"
          published_integrity="sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/markdstage-published.tgz" | base64 -w0)"
          if [ "$published_integrity" != "$integrity" ]; then
            echo "The downloaded npm tarball does not match registry integrity."
            exit 1
          fi
          curl -fsSL "$attestations_url" -o "$RUNNER_TEMP/markdstage-attestations.json"
          node - "$RUNNER_TEMP/markdstage-attestations.json" "$integrity" \
            "$PRODUCT_SHA" "$RELEASE_TAG" "$GITHUB_REPOSITORY" <<'NODE'
          const fs = require("node:fs");
          const [attestationsPath, integrity, productSha, releaseTag, repository] =
            process.argv.slice(2);
          const response = JSON.parse(fs.readFileSync(attestationsPath, "utf8"));
          const provenance = response.attestations?.find(
            (entry) => entry.predicateType === "https://slsa.dev/provenance/v1");
          if (!provenance?.bundle?.dsseEnvelope?.payload) {
            throw new Error("The published npm version has no SLSA provenance statement.");
          }
          const statement = JSON.parse(
            Buffer.from(provenance.bundle.dsseEnvelope.payload, "base64").toString("utf8"));
          const expectedDigest = Buffer.from(
            integrity.slice("sha512-".length), "base64").toString("hex");
          if (statement.predicateType !== "https://slsa.dev/provenance/v1" ||
              !statement.subject?.some((subject) => subject.digest?.sha512 === expectedDigest)) {
            throw new Error("The SLSA provenance subject does not match the published tarball.");
          }
          const definition = statement.predicate?.buildDefinition;
          const workflow = definition?.externalParameters?.workflow;
          if (workflow?.ref !== `refs/tags/${releaseTag}` ||
              workflow?.repository !== `https://github.com/${repository}` ||
              workflow?.path !== ".github/workflows/npm-publish.yml" ||
              !definition?.resolvedDependencies?.some(
                (dependency) => dependency.digest?.gitCommit === productSha)) {
            throw new Error("The SLSA provenance does not identify the expected release workflow and commit.");
          }
          console.log(`Verified npm tarball integrity and SLSA provenance for ${releaseTag}.`);
          NODE

  release:
    name: Publish GitHub Release
    needs:
      - validate
      - extension
      - desktop
      - vscode
      - npm
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      PRODUCT_SHA: ${{ needs.validate.outputs.release_sha }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.release_sha }}

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sed -i 's/\r$//' MarkdStage-win-x64.zip.sha256 MarkdStage-win-arm64.zip.sha256
          sed -i 's/\r$//' MarkdStage-win-x64.msix.sha256 MarkdStage-win-arm64.msix.sha256
          sed -i 's/\r$//' MarkdStage.cer.sha256
          sed -i 's/\r$//' markdstage-markdstage-*.tgz.sha256
          sed -i 's/\r$//' markdstage-vscode-*.vsix.sha256
          sha256sum -c "markdstage-${RELEASE_TAG}.zip.sha256"
          sha256sum -c markdstage-markdstage-*.tgz.sha256
          sha256sum -c markdstage-vscode-*.vsix.sha256
          sha256sum -c MarkdStage-win-x64.zip.sha256
          sha256sum -c MarkdStage-win-arm64.zip.sha256
          sha256sum -c MarkdStage-win-x64.msix.sha256
          sha256sum -c MarkdStage-win-arm64.msix.sha256
          sha256sum -c MarkdStage.cer.sha256

      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          extension_sha=$(awk '{print $1}' "release-assets/markdstage-${RELEASE_TAG}.zip.sha256")
          cli_sha=$(awk '{print $1}' release-assets/markdstage-markdstage-*.tgz.sha256)
          vscode_sha=$(awk '{print $1}' release-assets/markdstage-vscode-*.vsix.sha256)
          x64_zip_sha=$(awk '{print $1}' release-assets/MarkdStage-win-x64.zip.sha256)
          arm64_zip_sha=$(awk '{print $1}' release-assets/MarkdStage-win-arm64.zip.sha256)
          x64_sha=$(awk '{print $1}' release-assets/MarkdStage-win-x64.msix.sha256)
          arm64_sha=$(awk '{print $1}' release-assets/MarkdStage-win-arm64.msix.sha256)
          certificate_sha=$(awk '{print $1}' release-assets/MarkdStage.cer.sha256)
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" --jq .body > generated-notes.md
          cp ".github/release-notes/${RELEASE_TAG}.md" release-notes.md
          printf '\n' >> release-notes.md
          cat >> release-notes.md <<EOF

          ## Version targets

          - MarkdStage Canvas Extension: ${RELEASE_TAG}
          - MarkdStage Skill: ${RELEASE_TAG}
          - MarkdStage Desktop: ${RELEASE_TAG}
          - MarkdStage VS Code extension: ${RELEASE_TAG}
          - npm CLI: \`@markdstage/markdstage@${version}\`

          ## Requirements

          - npm CLI: Node.js 24 or later and Microsoft Edge, Google Chrome, or Chromium
          - Desktop: Windows 10 or Windows 11, x64 or ARM64, and Microsoft Edge WebView2 Runtime
          - Packaged CLI: WebView2 for native viewing and validation; installed Chromium for layout inspection, capture, and export. Remote-debugging policy can disable inspection, capture, and export.

          Windows portable packages contain the presenter and command-line executables and
          require no Node runtime. For GitHub Release sideloading, import \`MarkdStage.cer\`
          into the trusted people certificate store, then install the MSIX matching the device
          architecture. The Microsoft Store upload package is created locally and submitted
          separately through Partner Center.
          PDF/PowerPoint export is available from both the graphical app and CLI.
          Microsoft Store installation is available at https://apps.microsoft.com/detail/9N9DG772RM03;
          this GitHub Release does not publish a Store update. Portable and sideloading packages
          remain available from this release.
          Third-party license information is included in each distribution.

          Install the version-pinned Extension from:

          \`https://github.com/${GITHUB_REPOSITORY}/tree/${RELEASE_TAG}/.github/markdstage-dist\`

          ## Assets and SHA-256

          | File | SHA-256 |
          | --- | --- |
          | \`markdstage-${RELEASE_TAG}.zip\` | \`${extension_sha}\` |
          | \`markdstage-markdstage-${version}.tgz\` | \`${cli_sha}\` |
          | \`markdstage-vscode-${version}.vsix\` | \`${vscode_sha}\` |
          | \`MarkdStage-win-x64.zip\` | \`${x64_zip_sha}\` |
          | \`MarkdStage-win-arm64.zip\` | \`${arm64_zip_sha}\` |
          | \`MarkdStage-win-x64.msix\` | \`${x64_sha}\` |
          | \`MarkdStage-win-arm64.msix\` | \`${arm64_sha}\` |
          | \`MarkdStage.cer\` | \`${certificate_sha}\` |

          Verified commit: \`${PRODUCT_SHA}\`

          ## Changes

          EOF
          cat generated-notes.md >> release-notes.md

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            "release-assets/markdstage-${RELEASE_TAG}.zip"
            "release-assets/markdstage-${RELEASE_TAG}.zip.sha256"
            release-assets/markdstage-markdstage-*.tgz
            release-assets/markdstage-markdstage-*.tgz.sha256
            release-assets/markdstage-vscode-*.vsix
            release-assets/markdstage-vscode-*.vsix.sha256
            "release-assets/MarkdStage-win-x64.zip"
            "release-assets/MarkdStage-win-x64.zip.sha256"
            "release-assets/MarkdStage-win-arm64.zip"
            "release-assets/MarkdStage-win-arm64.zip.sha256"
            "release-assets/MarkdStage-win-x64.msix"
            "release-assets/MarkdStage-win-x64.msix.sha256"
            "release-assets/MarkdStage-win-arm64.msix"
            "release-assets/MarkdStage-win-arm64.msix.sha256"
            "release-assets/MarkdStage.cer"
            "release-assets/MarkdStage.cer.sha256"
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "MarkdStage $RELEASE_TAG" \
              --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "MarkdStage $RELEASE_TAG" \
              --notes-file release-notes.md
          fi

      - name: Verify published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name')
          version=$(node -p "require('./packages/markdstage-cli/package.json').version")
          for required in \
            "markdstage-${RELEASE_TAG}.zip" \
            "markdstage-${RELEASE_TAG}.zip.sha256" \
            "markdstage-markdstage-${version}.tgz" \
            "markdstage-markdstage-${version}.tgz.sha256" \
            "markdstage-vscode-${version}.vsix" \
            "markdstage-vscode-${version}.vsix.sha256" \
            "MarkdStage-win-x64.zip" \
            "MarkdStage-win-x64.zip.sha256" \
            "MarkdStage-win-arm64.zip" \
            "MarkdStage-win-arm64.zip.sha256" \
            "MarkdStage-win-x64.msix" \
            "MarkdStage-win-x64.msix.sha256" \
            "MarkdStage-win-arm64.msix" \
            "MarkdStage-win-arm64.msix.sha256" \
            "MarkdStage.cer" \
            "MarkdStage.cer.sha256"; do
            grep -qx "$required" <<<"$assets" || {
              echo "Missing release asset: $required"
              exit 1
            }
          done
          curl -fsSIL \
            "https://github.com/${GITHUB_REPOSITORY}/tree/${RELEASE_TAG}/.github/markdstage-dist" \
            >/dev/null

  marketplace:
    name: Publish VS Code Marketplace extension
    needs: [validate, vscode, release]
    runs-on: ubuntu-24.04
    environment: vscode-marketplace
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      PRODUCT_SHA: ${{ needs.validate.outputs.release_sha }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.release_sha }}

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: Install vsce
        working-directory: packages/markdstage-vscode
        run: npm ci

      - name: Download verified VSIX
        uses: actions/download-artifact@v5
        with:
          name: markdstage-vscode-release
          path: release-assets

      - name: Verify VSIX checksum
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sed -i 's/\r$//' markdstage-vscode-*.vsix.sha256
          sha256sum -c markdstage-vscode-*.vsix.sha256

      - name: Require Marketplace identity configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          test -n "$AZURE_CLIENT_ID" && test -n "$AZURE_TENANT_ID" || {
            echo "Set AZURE_CLIENT_ID and AZURE_TENANT_ID variables on the vscode-marketplace environment."
            exit 1
          }

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Show Marketplace identity
        shell: bash
        run: |
          set -euo pipefail
          az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query '{id: id, displayName: displayName}' -o json

      - name: Publish to Visual Studio Marketplace
        shell: bash
        working-directory: packages/markdstage-vscode
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          id=$(node -p "const p = require('./package.json'); p.publisher + '.' + p.name")
          vsix="$GITHUB_WORKSPACE/release-assets/markdstage-vscode-${version}.vsix"
          published_versions() {
            npx vsce show "$id" --json 2>/dev/null |
              node -e "let d=''; process.stdin.on('data', c => d += c); process.stdin.on('end', () => { try { for (const v of JSON.parse(d).versions ?? []) console.log(v.version); } catch {} });" ||
              true
          }
          if published_versions | grep -qx "$version"; then
            echo "$id@$version is already published."
          else
            npx vsce publish --packagePath "$vsix" --azure-credential
          fi

      - name: Verify Marketplace version
        shell: bash
        working-directory: packages/markdstage-vscode
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          id=$(node -p "const p = require('./package.json'); p.publisher + '.' + p.name")
          for attempt in {1..30}; do
            if npx vsce show "$id" --json 2>/dev/null |
              node -e "let d=''; process.stdin.on('data', c => d += c); process.stdin.on('end', () => process.exit((JSON.parse(d).versions ?? []).some(v => v.version === process.argv[1]) ? 0 : 1));" "$version"; then
              echo "Verified $id@$version on the Visual Studio Marketplace."
              exit 0
            fi
            echo "Waiting for Marketplace propagation ($attempt/30)..."
            sleep 20
          done
          echo "$id@$version was not visible on the Marketplace after 10 minutes."
          exit 1
