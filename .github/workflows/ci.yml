name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
      test: ${{ steps.classify.outputs.test }}
      cli: ${{ steps.classify.outputs.cli }}
      desktop: ${{ steps.classify.outputs.desktop }}
      samples: ${{ steps.classify.outputs.samples }}
      awesome: ${{ steps.classify.outputs.awesome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: Test path classification
        run: npm run test:ci

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/changed-files.txt"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            printf 'slides.md\n' > "$changed"
            node scripts/ci-paths.mjs --all
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only --no-renames --diff-filter=ACDMRTUXB \
              "$BASE_SHA" "$HEAD_SHA" > "$changed"
          elif [ -n "$BEFORE_SHA" ] &&
               [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] &&
               git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only --no-renames --diff-filter=ACDMRTUXB \
              "$BEFORE_SHA" "$GITHUB_SHA" > "$changed"
          else
            git diff-tree --no-commit-id --name-only --no-renames -r \
              "$GITHUB_SHA" > "$changed"
          fi

          echo "Changed paths:"
          sed 's/^/  /' "$changed"
          node scripts/ci-paths.mjs < "$changed"

      - name: Save changed paths
        uses: actions/upload-artifact@v5
        with:
          name: ci-changed-paths
          path: ${{ runner.temp }}/changed-files.txt
          retention-days: 1
          if-no-files-found: error

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: Validate local documentation links
        run: npm run test:docs

  awesome:
    name: Awesome Copilot plugin
    needs: changes
    if: needs.changes.outputs.awesome == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: Verify the published plugin tree
        # The tree under .github/plugin/markdstage is generated from the canonical Extension and
        # committed, so it can go stale. awesome:check is verify-only and never writes; it also
        # enforces the manifest, the Canvas entry point, and version alignment with the CLI.
        # The scripts have no npm dependencies, so no install step is needed.
        run: npm run awesome:check

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.test == 'true'
    # Visual regression screenshots depend heavily on the installed fonts. Pin the runner and use
    # the official Playwright container, which bundles the browser and fonts.
    # Local baseline updates use the same image (npm run test:visual:update:linux).
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --init --ipc=host

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: npm ci

      - name: Verify the Extension has no runtime npm dependencies
        # The Extension is distributed as a folder ZIP and must run directly in the user's environment.
        run: |
          set -e
          found=$(find .github/extensions/markdstage \
            \( -name package.json -o -name package-lock.json -o -name node_modules \) -print)
          if [ -n "$found" ]; then
            echo "The Extension directory contains npm dependencies:"
            echo "$found"
            exit 1
          fi
          echo "OK: The Extension directory has no npm dependencies."

      - name: Verify vendor asset integrity
        # Detect broken split Mermaid chunks before visual regression fails with an opaque timeout.
        run: npm run test:vendor

      - name: Validate Architecture DSL schemas
        # Keep JSON Schema and parseArchitecture verdicts aligned. Run this before unit tests because
        # an unchecked divergence would make the schema unreliable as a specification.
        run: npm run test:schema

      - name: Unit tests
        run: npm run test:unit

      - name: Editing workflow regression
        # Lock down browser behavior, including keeping editing UI out of presenter and print modes.
        # Run before visual regression to make failures easier to isolate.
        run: npm run test:editing

      - name: Visual regression
        run: npm run test:visual

      - name: Accessibility and output equivalence
        # Use axe-core and Chromium's accessibility tree (CDP) to verify spoken content, order, and
        # reachability. Also require canvas, presenter, and print to produce equivalent semantics and
        # rendering dimensions (WYSIWYG).
        run: npm run test:a11y

      - name: Rendering cost budget
        # Ensure layout and routing do not become quadratic or exponential in the element count.
        # This catches regressions that do not affect appearance and evade visual tests.
        run: npm run test:perf

      - name: PDF regression
        run: npm run test:pdf

      - name: PowerPoint regression
        run: npm run test:pptx

      - name: Save reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  cli:
    name: MarkdStage CLI
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: CLI unit tests
        # The CLI has no runtime npm dependencies, so no install step is needed.
        run: npm run test:cli

      - name: Pack the npm package
        working-directory: packages/markdstage-cli
        run: |
          set -e
          npm pack --pack-destination "$RUNNER_TEMP"
          tarball=$(ls "$RUNNER_TEMP"/markdstage-markdstage-*.tgz)
          echo "tarball=$tarball" >> "$GITHUB_ENV"
          tar -tzf "$tarball" > "$RUNNER_TEMP/contents.txt"
          for required in \
            package/bin/markdstage.mjs \
            package/src/cli.mjs \
            package/shared/markdown-deck.mjs \
            package/shared/hosts/node/presentation-server.mjs \
            package/shared/renderer/index.html \
            package/shared/schema/architecture-v1.schema.json \
            package/shared/vendor/marked.min.js; do
            grep -qx "$required" "$RUNNER_TEMP/contents.txt" || {
              echo "Missing from the npm package: $required"
              exit 1
            }
          done
          echo "OK: the npm package contains the shared runtime."

      - name: Clean install smoke test
        run: |
          set -e
          install_dir="$RUNNER_TEMP/markdstage-install"
          mkdir -p "$install_dir"
          cd "$install_dir"
          npm install --no-save "$tarball"
          ./node_modules/.bin/markdstage --version
          ./node_modules/.bin/markdstage guide slide-format > /dev/null
          ./node_modules/.bin/markdstage validate "$GITHUB_WORKSPACE/slides.md" --json > /dev/null
          echo "OK: the packed CLI runs from a clean install."

  samples:
    name: Sample decks
    needs: changes
    if: needs.changes.outputs.samples == 'true'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --init --ipc=host

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore changed paths
        uses: actions/download-artifact@v5
        with:
          name: ci-changed-paths
          path: ${{ runner.temp }}/ci-changed-paths

      - name: Install dependencies
        run: npm ci

      - name: Add Playwright Chromium to PATH
        shell: bash
        run: |
          set -euo pipefail
          browser=$(find "$PLAYWRIGHT_BROWSERS_PATH" \
            -type f -path '*/chromium_headless_shell-*/*' \
            \( -name headless_shell -o -name chrome-headless-shell \) \
            -print -quit)
          if [ -z "$browser" ] || [ ! -x "$browser" ]; then
            echo "Playwright Chromium headless shell was not found in $PLAYWRIGHT_BROWSERS_PATH."
            exit 1
          fi
          browser_bin="$RUNNER_TEMP/markdstage-browser"
          mkdir -p "$browser_bin"
          ln -s "$browser" "$browser_bin/chrome"
          echo "$browser_bin" >> "$GITHUB_PATH"

      - name: Validate changed sample decks
        shell: bash
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/scripts/ci-samples.mjs" \
            < "$RUNNER_TEMP/ci-changed-paths/changed-files.txt"

  desktop:
    name: MarkdStage Desktop
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js for shared-runtime conformance tests
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: WinApp CLI
        shell: pwsh
        run: |
          if (-not (Get-Command winapp -ErrorAction SilentlyContinue)) {
            winget install --id Microsoft.WinAppCli --version 0.6.1 --exact --silent --accept-package-agreements --accept-source-agreements
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          winapp --version

      - name: Core tests
        run: dotnet test apps\MarkdStage.Desktop\tests\MarkdStage.Core.Tests\MarkdStage.Core.Tests.csproj -c Release

      - name: Desktop package data tests
        run: node --test apps\MarkdStage.Desktop\tests\package-data.test.mjs

      - name: WinUI build
        run: dotnet build apps\MarkdStage.Desktop\src\MarkdStage.App\MarkdStage.App.csproj -c Release -r win-x64 -p:Platform=x64

      - name: x64 unsigned MSIX
        shell: pwsh
        run: apps\MarkdStage.Desktop\scripts\Publish.ps1 -Architecture x64 -Unsigned -Publisher "CN=MarkdStageDevelopment"

      - name: ARM64 unsigned MSIX
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: apps\MarkdStage.Desktop\scripts\Publish.ps1 -Architecture arm64 -Unsigned -Publisher "CN=MarkdStageDevelopment"

      - name: MSIX validation artifacts
        uses: actions/upload-artifact@v5
        with:
          name: markdstage-desktop
          path: |
            apps/MarkdStage.Desktop/artifacts/*.msix
            apps/MarkdStage.Desktop/artifacts/*.sha256
          retention-days: 7
          if-no-files-found: error

  native-cli:
    name: Native CLI (${{ matrix.architecture }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            architecture: x64
            platform: x64
          - runner: windows-11-arm
            architecture: arm64
            platform: ARM64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Native message loop and WebView2 lifetime tests
        run: dotnet test apps\MarkdStage.Desktop\tests\MarkdStage.Cli.Tests\MarkdStage.Cli.Tests.csproj -c Release -r win-${{ matrix.architecture }} -p:Platform=${{ matrix.platform }}

      - name: Build native CLI
        run: dotnet build apps\MarkdStage.Desktop\src\MarkdStage.Cli\MarkdStage.Cli.csproj -c Release -r win-${{ matrix.architecture }} -p:Platform=${{ matrix.platform }}

      - name: Native inspect, capture, PDF, and PowerPoint smoke tests
        shell: pwsh
        run: |
          $env:MARKDSTAGE_NATIVE_CLI = (Resolve-Path "apps\MarkdStage.Desktop\src\MarkdStage.Cli\bin\${{ matrix.platform }}\Release\net10.0-windows10.0.26100.0\win-${{ matrix.architecture }}\MarkdStageCli.exe").Path
          node --test apps\MarkdStage.Desktop\tests\native-cli.test.mjs

  gate:
    name: CI
    if: always()
    needs:
      - changes
      - docs
      - test
      - cli
      - desktop
      - native-cli
      - samples
      - awesome
    runs-on: ubuntu-24.04

    steps:
      - name: Verify selected jobs
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_SELECTED: ${{ needs.changes.outputs.docs }}
          DOCS_RESULT: ${{ needs.docs.result }}
          TEST_SELECTED: ${{ needs.changes.outputs.test }}
          TEST_RESULT: ${{ needs.test.result }}
          CLI_SELECTED: ${{ needs.changes.outputs.cli }}
          CLI_RESULT: ${{ needs.cli.result }}
          DESKTOP_SELECTED: ${{ needs.changes.outputs.desktop }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          NATIVE_CLI_RESULT: ${{ needs.native-cli.result }}
          SAMPLES_SELECTED: ${{ needs.changes.outputs.samples }}
          SAMPLES_RESULT: ${{ needs.samples.result }}
          AWESOME_SELECTED: ${{ needs.changes.outputs.awesome }}
          AWESOME_RESULT: ${{ needs.awesome.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Changes failed with result: $CHANGES_RESULT"
            exit 1
          fi

          check_job() {
            local name="$1"
            local selected="$2"
            local result="$3"
            if [ "$selected" = "true" ]; then
              if [ "$result" != "success" ]; then
                echo "$name was selected but completed with result: $result"
                exit 1
              fi
            elif [ "$result" != "skipped" ]; then
              echo "$name was not selected but completed with result: $result"
              exit 1
            fi
          }

          check_job "Documentation" "$DOCS_SELECTED" "$DOCS_RESULT"
          check_job "Test" "$TEST_SELECTED" "$TEST_RESULT"
          check_job "MarkdStage CLI" "$CLI_SELECTED" "$CLI_RESULT"
          check_job "MarkdStage Desktop" "$DESKTOP_SELECTED" "$DESKTOP_RESULT"
          check_job "Native CLI" "$DESKTOP_SELECTED" "$NATIVE_CLI_RESULT"
          check_job "Sample decks" "$SAMPLES_SELECTED" "$SAMPLES_RESULT"
          check_job "Awesome Copilot plugin" "$AWESOME_SELECTED" "$AWESOME_RESULT"
          echo "All selected CI jobs passed."
