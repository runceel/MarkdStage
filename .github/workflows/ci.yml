name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
      test: ${{ steps.classify.outputs.test }}
      cli: ${{ steps.classify.outputs.cli }}
      desktop: ${{ steps.classify.outputs.desktop }}
      samples: ${{ steps.classify.outputs.samples }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: Test path classification
        run: npm run test:ci

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/ci-paths.mjs --all
            exit 0
          fi

          changed="$RUNNER_TEMP/changed-files.txt"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only --no-renames --diff-filter=ACDMRTUXB \
              "$BASE_SHA" "$HEAD_SHA" > "$changed"
          elif [ -n "$BEFORE_SHA" ] &&
               [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] &&
               git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only --no-renames --diff-filter=ACDMRTUXB \
              "$BEFORE_SHA" "$GITHUB_SHA" > "$changed"
          else
            git diff-tree --no-commit-id --name-only --no-renames -r \
              "$GITHUB_SHA" > "$changed"
          fi

          echo "Changed paths:"
          sed 's/^/  /' "$changed"
          node scripts/ci-paths.mjs < "$changed"

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: Validate local documentation links
        run: npm run test:docs

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.test == 'true'
    # Visual regression screenshots depend heavily on the installed fonts. Pin the runner and use
    # the official Playwright container, which bundles the browser and fonts.
    # Local baseline updates use the same image (npm run test:visual:update:linux).
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --init --ipc=host

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: npm ci

      - name: Verify the Extension has no runtime npm dependencies
        # The Extension is distributed as a folder ZIP and must run directly in the user's environment.
        run: |
          set -e
          found=$(find .github/extensions/markdstage \
            \( -name package.json -o -name package-lock.json -o -name node_modules \) -print)
          if [ -n "$found" ]; then
            echo "The Extension directory contains npm dependencies:"
            echo "$found"
            exit 1
          fi
          echo "OK: The Extension directory has no npm dependencies."

      - name: Verify vendor asset integrity
        # Detect broken split Mermaid chunks before visual regression fails with an opaque timeout.
        run: npm run test:vendor

      - name: Validate Architecture DSL schemas
        # Keep JSON Schema and parseArchitecture verdicts aligned. Run this before unit tests because
        # an unchecked divergence would make the schema unreliable as a specification.
        run: npm run test:schema

      - name: Unit tests
        run: npm run test:unit

      - name: Editing workflow regression
        # Lock down browser behavior, including keeping editing UI out of presenter and print modes.
        # Run before visual regression to make failures easier to isolate.
        run: npm run test:editing

      - name: Visual regression
        run: npm run test:visual

      - name: Accessibility and output equivalence
        # Use axe-core and Chromium's accessibility tree (CDP) to verify spoken content, order, and
        # reachability. Also require canvas, presenter, and print to produce equivalent semantics and
        # rendering dimensions (WYSIWYG).
        run: npm run test:a11y

      - name: Rendering cost budget
        # Ensure layout and routing do not become quadratic or exponential in the element count.
        # This catches regressions that do not affect appearance and evade visual tests.
        run: npm run test:perf

      - name: PDF regression
        run: npm run test:pdf

      - name: PowerPoint regression
        run: npm run test:pptx

      - name: Save reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  cli:
    name: MarkdStage CLI
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: CLI unit tests
        # The CLI has no runtime npm dependencies, so no install step is needed.
        run: npm run test:cli

      - name: Generated Agent Skills are up to date
        # Skill references are generated from the canonical markdstage_guide topics.
        run: npm run skills:check

      - name: Pack the npm package
        working-directory: packages/markdstage-cli
        run: |
          set -e
          npm pack --pack-destination "$RUNNER_TEMP"
          tarball=$(ls "$RUNNER_TEMP"/markdstage-markdstage-*.tgz)
          echo "tarball=$tarball" >> "$GITHUB_ENV"
          tar -tzf "$tarball" > "$RUNNER_TEMP/contents.txt"
          for required in \
            package/bin/markdstage.mjs \
            package/src/cli.mjs \
            package/shared/markdown-deck.mjs \
            package/shared/runtime/presentation-server.mjs \
            package/shared/renderer/index.html \
            package/shared/schema/architecture-v1.schema.json \
            package/shared/vendor/marked.min.js; do
            grep -qx "$required" "$RUNNER_TEMP/contents.txt" || {
              echo "Missing from the npm package: $required"
              exit 1
            }
          done
          echo "OK: the npm package contains the shared runtime."

      - name: Clean install smoke test
        run: |
          set -e
          install_dir="$RUNNER_TEMP/markdstage-install"
          mkdir -p "$install_dir"
          cd "$install_dir"
          npm install --no-save "$tarball"
          ./node_modules/.bin/markdstage --version
          ./node_modules/.bin/markdstage guide slide-format > /dev/null
          ./node_modules/.bin/markdstage validate "$GITHUB_WORKSPACE/slides.md" --json > /dev/null
          echo "OK: the packed CLI runs from a clean install."

  samples:
    name: Sample decks
    needs: changes
    if: needs.changes.outputs.samples == 'true'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --init --ipc=host

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Add Playwright Chromium to PATH
        shell: bash
        run: |
          set -euo pipefail
          browser=("$PLAYWRIGHT_BROWSERS_PATH"/chromium_headless_shell-*/chrome-linux/headless_shell)
          if [ "${#browser[@]}" -ne 1 ] || [ ! -x "${browser[0]}" ]; then
            echo "Playwright Chromium headless shell was not found in $PLAYWRIGHT_BROWSERS_PATH."
            exit 1
          fi
          browser_bin="$RUNNER_TEMP/markdstage-browser"
          mkdir -p "$browser_bin"
          ln -s "${browser[0]}" "$browser_bin/chrome"
          echo "$browser_bin" >> "$GITHUB_PATH"

      - name: Validate changed sample decks
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/ci-samples.mjs <<< "slides.md"
            exit 0
          fi

          changed="$RUNNER_TEMP/changed-files.txt"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only --no-renames --diff-filter=ACDMRTUXB \
              "$BASE_SHA" "$HEAD_SHA" > "$changed"
          elif [ -n "$BEFORE_SHA" ] &&
               [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] &&
               git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only --no-renames --diff-filter=ACDMRTUXB \
              "$BEFORE_SHA" "$GITHUB_SHA" > "$changed"
          else
            git diff-tree --no-commit-id --name-only --no-renames -r \
              "$GITHUB_SHA" > "$changed"
          fi
          node scripts/ci-samples.mjs < "$changed"

  desktop:
    name: MarkdStage Desktop
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Core tests
        run: dotnet test apps\MarkdStage.Desktop\tests\MarkdStage.Core.Tests\MarkdStage.Core.Tests.csproj -c Release

      - name: WinUI build
        run: dotnet build apps\MarkdStage.Desktop\src\MarkdStage.App\MarkdStage.App.csproj -c Release -r win-x64 -p:Platform=x64

      - name: x64 portable publish
        shell: pwsh
        run: apps\MarkdStage.Desktop\scripts\Publish.ps1 -Architecture x64

      - name: ARM64 portable publish
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: apps\MarkdStage.Desktop\scripts\Publish.ps1 -Architecture arm64

      - name: Portable artifacts
        uses: actions/upload-artifact@v5
        with:
          name: markdstage-desktop
          path: |
            apps/MarkdStage.Desktop/artifacts/*.zip
            apps/MarkdStage.Desktop/artifacts/*.sha256
          retention-days: 7
          if-no-files-found: error

  gate:
    name: CI
    if: always()
    needs:
      - changes
      - docs
      - test
      - cli
      - desktop
      - samples
    runs-on: ubuntu-24.04

    steps:
      - name: Verify selected jobs
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_SELECTED: ${{ needs.changes.outputs.docs }}
          DOCS_RESULT: ${{ needs.docs.result }}
          TEST_SELECTED: ${{ needs.changes.outputs.test }}
          TEST_RESULT: ${{ needs.test.result }}
          CLI_SELECTED: ${{ needs.changes.outputs.cli }}
          CLI_RESULT: ${{ needs.cli.result }}
          DESKTOP_SELECTED: ${{ needs.changes.outputs.desktop }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          SAMPLES_SELECTED: ${{ needs.changes.outputs.samples }}
          SAMPLES_RESULT: ${{ needs.samples.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Changes failed with result: $CHANGES_RESULT"
            exit 1
          fi

          check_job() {
            local name="$1"
            local selected="$2"
            local result="$3"
            if [ "$selected" = "true" ]; then
              if [ "$result" != "success" ]; then
                echo "$name was selected but completed with result: $result"
                exit 1
              fi
            elif [ "$result" != "skipped" ]; then
              echo "$name was not selected but completed with result: $result"
              exit 1
            fi
          }

          check_job "Documentation" "$DOCS_SELECTED" "$DOCS_RESULT"
          check_job "Test" "$TEST_SELECTED" "$TEST_RESULT"
          check_job "MarkdStage CLI" "$CLI_SELECTED" "$CLI_RESULT"
          check_job "MarkdStage Desktop" "$DESKTOP_SELECTED" "$DESKTOP_RESULT"
          check_job "Sample decks" "$SAMPLES_SELECTED" "$SAMPLES_RESULT"
          echo "All selected CI jobs passed."
