scripts:
  - name: Site preview
    command: npm run preview:site
  - name: Desktop app
    command: 'dotnet run --project apps\MarkdStage.Desktop\src\MarkdStage.App\MarkdStage.App.csproj -p:EnableWinAppRunSupport=true'
  - name: MarkdStage CLI
    command: 'node packages\markdstage-cli\bin\markdstage.mjs'

server_ready_pattern: 'MarkdStage site preview:\s+(https?://\S+)'
auto_open_in_browser: true
