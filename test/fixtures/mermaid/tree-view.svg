<svg id="fixture-tree-view" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 0 145.78125 290" style="max-width: 145.78125px;" role="graphics-document document" aria-roledescription="treeView"><style>#fixture-tree-view{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#fixture-tree-view .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#fixture-tree-view .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#fixture-tree-view .error-icon{fill:#552222;}#fixture-tree-view .error-text{fill:#552222;stroke:#552222;}#fixture-tree-view .edge-thickness-normal{stroke-width:1px;}#fixture-tree-view .edge-thickness-thick{stroke-width:3.5px;}#fixture-tree-view .edge-pattern-solid{stroke-dasharray:0;}#fixture-tree-view .edge-thickness-invisible{stroke-width:0;fill:none;}#fixture-tree-view .edge-pattern-dashed{stroke-dasharray:3;}#fixture-tree-view .edge-pattern-dotted{stroke-dasharray:2;}#fixture-tree-view .marker{fill:#333333;stroke:#333333;}#fixture-tree-view .marker.cross{stroke:#333333;}#fixture-tree-view svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#fixture-tree-view p{margin:0;}#fixture-tree-view .treeView-node-label{font-size:16px;fill:black;}#fixture-tree-view .treeView-node-line{stroke:black;}#fixture-tree-view .node .neo-node{stroke:#9370DB;}#fixture-tree-view [data-look="neo"].node rect,#fixture-tree-view [data-look="neo"].cluster rect,#fixture-tree-view [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-tree-view [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#fixture-tree-view [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-tree-view [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#fixture-tree-view [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-tree-view [data-look="neo"].node circle .state-start{fill:#000000;}#fixture-tree-view [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-tree-view [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-tree-view :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g class="tree-view"><text dominant-baseline="middle" class="treeView-node-label" x="5" y="14.5">/</text><line x1="-10" y1="14.5" x2="0" y2="14.5" stroke-width="1" class="treeView-node-line"></line><text dominant-baseline="middle" class="treeView-node-label" x="20" y="43.5">サービス
Service</text><line x1="5" y1="43.5" x2="15" y2="43.5" stroke-width="1" class="treeView-node-line"></line><text dominant-baseline="middle" class="treeView-node-label" x="35" y="72.5">API</text><line x1="20" y1="72.5" x2="30" y2="72.5" stroke-width="1" class="treeView-node-line"></line><text dominant-baseline="middle" class="treeView-node-label" x="50" y="101.5">認証
