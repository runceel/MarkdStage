<svg id="treemap-basic" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="2 -2.375 996 430.375" style="max-width: 996px;" class="flowchart" role="graphics-document document" aria-roledescription="treemap"><style>#treemap-basic{font-family:Arial;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#treemap-basic .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#treemap-basic .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#treemap-basic .error-icon{fill:#552222;}#treemap-basic .error-text{fill:#552222;stroke:#552222;}#treemap-basic .edge-thickness-normal{stroke-width:1px;}#treemap-basic .edge-thickness-thick{stroke-width:3.5px;}#treemap-basic .edge-pattern-solid{stroke-dasharray:0;}#treemap-basic .edge-thickness-invisible{stroke-width:0;fill:none;}#treemap-basic .edge-pattern-dashed{stroke-dasharray:3;}#treemap-basic .edge-pattern-dotted{stroke-dasharray:2;}#treemap-basic .marker{fill:#333333;stroke:#333333;}#treemap-basic .marker.cross{stroke:#333333;}#treemap-basic svg{font-family:Arial;font-size:16px;}#treemap-basic p{margin:0;}#treemap-basic .treemapNode.section{stroke:black;stroke-width:1;fill:#efefef;}#treemap-basic .treemapNode.leaf{stroke:black;stroke-width:1;fill:#efefef;}#treemap-basic .treemapLabel{fill:#333;font-size:12px;}#treemap-basic .treemapValue{fill:#333;font-size:10px;}#treemap-basic .treemapTitle{fill:#333;font-size:14px;}#treemap-basic .node .neo-node{stroke:#9370DB;}#treemap-basic [data-look="neo"].node rect,#treemap-basic [data-look="neo"].cluster rect,#treemap-basic [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#treemap-basic [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#treemap-basic [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#treemap-basic [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#treemap-basic [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#treemap-basic [data-look="neo"].node circle .state-start{fill:#000000;}#treemap-basic [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#treemap-basic [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#treemap-basic :root{--mermaid-font-family:Arial;}</style><g></g><text x="500" y="15" class="treemapTitle" text-anchor="middle" dominant-baseline="middle">Portfolio / 配分</text><g transform="translate(0, 30)" class="treemapContainer"><g class="treemapSection" transform="translate(0,0)"><rect width="1000" height="25" class="treemapSectionHeader" fill="none" fill-opacity="0.6" stroke-width="0.6" style="display: none;"></rect><clipPath id="clip-section-treemap-basic-0"><rect width="988" height="25"></rect></clipPath><rect width="1000" height="400" class="treemapSection section0" fill="transparent" fill-opacity="0.6" stroke="transparent" stroke-width="2" stroke-opacity="0.4" style="display: none;"></rect><text class="treemapSectionLabel" x="6" y="12.5" dominant-baseline="middle" font-weight="bold" style="display: none;"></text><text class="treemapSectionValue" x="990" y="12.5" text-anchor="end" dominant-baseline="middle" font-style="italic" style="display: none;">100</text></g><g class="treemapSection" transform="translate(10,35)"><rect width="683" height="25" class="treemapSectionHeader" fill="none" fill-opacity="0.6" stroke-width="0.6" style=""></rect><clipPath id="clip-section-treemap-basic-1"><rect width="671" height="25"></rect></clipPath><rect width="683" height="355" class="treemapSection section1" fill="hsl(240, 100%, 76.2745098039%)" fill-opacity="0.6" stroke="hsl(240, 100%, 61.2745098039%)" stroke-width="2" st