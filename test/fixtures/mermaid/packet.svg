<svg id="fixture-packet" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1026 188" style="max-width: 1026px;" role="graphics-document document" aria-roledescription="packet"><style>#fixture-packet{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#fixture-packet .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#fixture-packet .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#fixture-packet .error-icon{fill:#552222;}#fixture-packet .error-text{fill:#552222;stroke:#552222;}#fixture-packet .edge-thickness-normal{stroke-width:1px;}#fixture-packet .edge-thickness-thick{stroke-width:3.5px;}#fixture-packet .edge-pattern-solid{stroke-dasharray:0;}#fixture-packet .edge-thickness-invisible{stroke-width:0;fill:none;}#fixture-packet .edge-pattern-dashed{stroke-dasharray:3;}#fixture-packet .edge-pattern-dotted{stroke-dasharray:2;}#fixture-packet .marker{fill:#333333;stroke:#333333;}#fixture-packet .marker.cross{stroke:#333333;}#fixture-packet svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#fixture-packet p{margin:0;}#fixture-packet .packetByte{font-size:10px;}#fixture-packet .packetByte.start{fill:black;}#fixture-packet .packetByte.end{fill:black;}#fixture-packet .packetLabel{fill:black;font-size:12px;}#fixture-packet .packetTitle{fill:black;font-size:14px;}#fixture-packet .packetBlock{stroke:black;stroke-width:1;fill:#efefef;}#fixture-packet .node .neo-node{stroke:#9370DB;}#fixture-packet [data-look="neo"].node rect,#fixture-packet [data-look="neo"].cluster rect,#fixture-packet [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-packet [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}