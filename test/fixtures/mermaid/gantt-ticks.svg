<svg id="gantt-ticks" width="1280" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 228" height="228" role="graphics-document document" aria-roledescription="gantt"><style>#gantt-ticks{font-family:Arial;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#gantt-ticks .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#gantt-ticks .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#gantt-ticks .error-icon{fill:#552222;}#gantt-ticks .error-text{fill:#552222;stroke:#552222;}#gantt-ticks .edge-thickness-normal{stroke-width:1px;}#gantt-ticks .edge-thickness-thick{stroke-width:3.5px;}#gantt-ticks .edge-pattern-solid{stroke-dasharray:0;}#gantt-ticks .edge-thickness-invisible{stroke-width:0;fill:none;}#gantt-ticks .edge-pattern-dashed{stroke-dasharray:3;}#gantt-ticks .edge-pattern-dotted{stroke-dasharray:2;}#gantt-ticks .marker{fill:#333333;stroke:#333333;}#gantt-ticks .marker.cross{stroke:#333333;}#gantt-ticks svg{font-family:Arial;font-size:16px;}#gantt-ticks p{margin:0;}#gantt-ticks .mermaid-main-font{font-family:Arial;}#gantt-ticks .exclude-range{fill:#eeeeee;}#gantt-ticks .section{stroke:none;opacity:0.2;}#gantt-ticks .section0{fill:rgba(102, 102, 255, 0.49);}#gantt-ticks .section2{fill:#fff400;}#gantt-ticks .section1,#gantt-ticks .section3{fill:white;opacity:0.2;}#gantt-ticks .sectionTitle0{fill:#333;}#gantt-ticks .sectionTitle1{fill:#333;}#gantt-ticks .sectionTitle2{fill:#333;}#gantt-ticks .sectionTitle3{fill:#333;}#gantt-ticks .sectionTitle{text-anchor:start;font-family:Arial;}#gantt-ticks .grid .tick{stroke:lightgrey;opacity:0.8;shape-rendering:crispEdges;}#gantt-ticks .grid .tick text{font-family:Arial;fill:#333;}#gantt-ticks .grid path{stroke-width:0;}#gantt-ticks .today{fill:none;stroke:red;stroke-width:2px;}#gantt-ticks .task{s