eCrit3{stroke:#ff8888;fill:#bfc7ff;stroke-width:2;}#gantt-ticks .doneCrit0,#gantt-ticks .doneCrit1,#gantt-ticks .doneCrit2,#gantt-ticks .doneCrit3{stroke:#ff8888;fill:lightgrey;stroke-width:2;cursor:pointer;shape-rendering:crispEdges;}#gantt-ticks .milestone{transform:rotate(45deg) scale(0.8,0.8);}#gantt-ticks .milestoneText{font-style:italic;}#gantt-ticks .doneCritText0,#gantt-ticks .doneCritText1,#gantt-ticks .doneCritText2,#gantt-ticks .doneCritText3{fill:black!important;}#gantt-ticks .doneCritText0.taskTextOutsideLeft,#gantt-ticks .doneCritText0.taskTextOutsideRight,#gantt-ticks .doneCritText1.taskTextOutsideLeft,#gantt-ticks .doneCritText1.taskTextOutsideRight,#gantt-ticks .doneCritText2.taskTextOutsideLeft,#gantt-ticks .doneCritText2.taskTextOutsideRight,#gantt-ticks .doneCritText3.taskTextOutsideLeft,#gantt-ticks .doneCritText3.taskTextOutsideRight{fill:black!important;}#gantt-ticks .vert{stroke:navy;}#gantt-ticks .vertText{font-size:15px;text-anchor:middle;fill:navy!important;}#gantt-ticks .activeCritText0,#gantt-ticks .activeCritText1,#gantt-ticks .activeCritText2,#gantt-ticks .activeCritText3{fill:black!important;}#gantt-ticks .titleText{text-anchor:middle;font-size:18px;fill:#333;font-family:Arial;}#gantt-ticks .node .neo-node{stroke:#9370DB;}#gantt-ticks [data-look="neo"].node rect,#gantt-ticks [data-look="neo"].cluster rect,#gantt-ticks [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#gantt-ticks [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#gantt-ticks [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#gantt-ticks [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#gantt-ticks [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#gantt-ticks [data-look="neo"].node circle .state-start{fill:#000000;}#gantt-ticks [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#gantt-ticks [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#gantt-ticks .grid .tick{opacity:1;}#gantt-ticks .grid .tick text{transform:rotate(25deg);text-anchor:start;}#gantt-ticks :root{--mermaid-font-family:Arial;}</style><g></g><g class="grid" transform="translate(75, 178)" fill="none" font-size="10" font-family="sans-serif" text-anchor="middle"><path class="domain" stroke="currentColor" d="M0.5,-143V0.5H1130.5V-143"></path><g class="tick" opacity="1" transform="translate(283.5,0)"><line stroke="currentColor" y2="-143"></line><text fill="#000" y="3" dy="1em" stroke="none" font-size="10" style="text-anchor: middle;">Jan 11</text></g><g class="tick" opacity="1" transform="translate(612.5,0)"><line stroke="currentColor" y2="-143"></line><text fill="#000" y="3" dy="1em" stroke="none" font-size="10" style="text-anchor: middle;">Jan 18</text></g><g class="tick" opacity="1" transform="translate(942.5,0)"><line stroke="currentColor" y2="-143"></line><text fill="#000" y="3" dy="1em" stroke="none" font-size="10" style="text-anchor: middle;">Jan 25</text></g></g><g><rect x="0" y="48" width="1242.5" height="32" class="section section0"></rect><rect x="0" y="112" width="1242.5" height="32" class="section section1"></rect><rect x="0" y="80" width="1242.5" height="32" class="section section0"></rect><rect x="0" y="144" width="1242.5" height="32" class="section section1"></rect></g><g><rect id="gantt-ticks-planning" rx="3" ry="3" x="75" y="50" width="471" height="28" transform-origin="310.5px 64px" class="task done0 "></rect><rect id="gantt-ticks-build" rx="3" ry="3" x="499" y="114" width="706" height="28" transform-origin="852px 128px" class="task active1 "></rect><rect id="gantt-ticks-ready" rx="3" ry="3" x="532" y="82" width="28" height="28" transform-origin="546px 96px" class="task milestone  task0 "></rect><rect id="gantt-ticks-ship" rx="3" ry="3" x="1191" y="146" width="28" height="28" transform-origin="1205px 160px" class="task milestone  crit1 "></rect><text id="gantt-ticks-planning-text" font-size="14" x="310.5" y="69" text-height="28" class=" taskText taskText0  doneText0 width-94.171875">Planning / 計画 </text><text id="gantt-ticks-build-text" font-size="14" x="852" y="133" text-height="28" class=" taskText taskText1 activeText1 width-70.8125">Build / 実装 </text><text id="gantt-ticks-ready-text" font-size="14" x="565" y="101" text-height="28" class=" taskTextOutsideRight taskTextOutside0  milestoneText width-40.46875">Ready </text><text id="gantt-ticks-ship-text" font-size="14" x="1186" y="165" text-height="28" class=" taskTextOutsideLeft taskTextOutside1  critText1 milestoneText">Ship </text></g><g><text dy="0em" x="10" y="82" font-size="13" class="sectionTitle sectionTitle0"><tspan alignment-baseline="central" x="10">Prepare</tspan></text><text dy="0em" x="10" y="146" font-size="13" class="sectionTitle sectionTitle1"><tspan alignment-baseline="central" x="10">Deliver</tspan></text></g><text x="640" y="25" class="titleText">Period ticks / 期間</text></svg>