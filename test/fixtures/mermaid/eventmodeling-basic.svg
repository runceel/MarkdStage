<svg id="eventmodeling-basic" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 721px;" viewBox="-30 -30 721 610" role="graphics-document document" aria-roledescription="eventmodeling"><style>#eventmodeling-basic{font-family:Arial;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#eventmodeling-basic .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#eventmodeling-basic .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#eventmodeling-basic .error-icon{fill:#552222;}#eventmodeling-basic .error-text{fill:#552222;stroke:#552222;}#eventmodeling-basic .edge-thickness-normal{stroke-width:1px;}#eventmodeling-basic .edge-thickness-thick{stroke-width:3.5px;}#eventmodeling-basic .edge-pattern-solid{stroke-dasharray:0;}#eventmodeling-basic .edge-thickness-invisible{stroke-width:0;fill:none;}#eventmodeling-basic .edge-pattern-dashed{stroke-dasharray:3;}#eventmodeling-basic .edge-pattern-dotted{stroke-dasharray:2;}#eventmodeling-basic .marker{fill:#333333;stroke:#333333;}#eventmodeling-basic .marker.cross{stroke:#333333;}#eventmodeling-basic svg{font-family:Arial;font-size:16px;}#eventmodeling-basic p{margin:0;}#eventmodeling-basic .node .neo-node{stroke:#9370DB;}#eventmodeling-basic [data-look="neo"].node rect,#eventmodeling-basic [data-look="neo"].cluster rect,#eventmodeling-basic [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#eventmodeling-basic [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#eventmodeling-basic [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#eventmodeling-basic [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#eventmodeling-basic [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#eventmodeling-basic [data-look="neo"].node circle .state-start{fill:#000000;}#eventmodeling-basic [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#eventmodeling-basic [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#eventmodeling-basic :root{--mermaid-font-family:Arial;}</style><g></g><g class="em-swimlane"><rect x="0" y="0" rx="3" width="661" height="130" fill="rgb(250,250,250)" stroke="rgb(240,240,240)"></rect><text font-weight="bold" x="30" y="30">UI/A: Order</text></g><g class="em-swimlane"><rect x="0" y="140" rx="3" width="661" height="130" fill="rgb(250,250,250)" stroke="rgb(240,240,240)"></rect><text font-weight="bold" x="30" y="170">C/RM: Order</text></g><g class="em-swimlane"><rect x="0" y="280" rx="3" width="661" height="130" fill="rgb(250,250,250)" stroke="rgb(240,240,240)"></rect><text font-weight="bold" x="30" y="310">C/RM: Order</text></g><g class="em-swimlane"><rect x="0" y="420" rx="3" width="661" height="130" fill="rgb(250,250,250)" stroke="rgb(240,240,240)"></rect><text font-weight="bold" x="30" y="450">Stream: Order</text></g><g class="em-box"><rect x="250" y="15" rx="3" width="141" height="100" stroke="#dbdada" fill="white"></rect><foreignObject x="260" y="25" width="121" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; height: 100%; width: 100%;"><span style="display: table-cell; text-align: center; vertical-align: middle;"><b>Form</b></span></div></foreignObject></g><g class="em-box"><rect x="321" y="155" rx="3" width="154" height="100" stroke="#679ac3" fill="#bcd6fe"></rect><foreignObject x="331" y="165" width="134" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; height: 100%; width: 100%;"><span style="display: table-cell; text-align: center; vertical-align: middle;"><b>Submit</b></span></div></foreignObject></g><g class="em-box"><rect x="405" y="435" rx="3" width="172" height="100" stroke="#c19a0f" fill="#ffb778"></rect><foreignObject x="415" y="445" width="152" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; height: 100%; width: 100%;"><span style="display: table-cell; text-align: center; vertical-align: middle;"><b>Accepted</b></span></div></foreignObject></g><g class="em-box"><rect x="507" y="295" rx="3" width="129" height="100" stroke="#a3b732" fill="#d3f1a2"></rect><foreignObject x="517" y="305" width="109" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; height: 100%; width: 100%;"><span style="display: table-cell; text-align: center; vertical-align: middle;"><b>List</b></span></div></foreignObject></g><path class="em-relation" fill="none" stroke="#333333" stroke-width="1" marker-end="url(#em-arrowhead-eventmodeling-basic)" d="M344 115 L372.3333333333333 155"></path><path class="em-relation" fill="none" stroke="#333333" stroke-width="1" marker-end="url(#em-arrowhead-eventmodeling-basic)" d="M423.6666666666667 255 L462.3333333333333 435"></path><path class="em-relation" fill="none" stroke="#333333" stroke-width="1" marker-end="url(#em-arrowhead-eventmodeling-basic)" d="M519.6666666666666 435 L550 395"></path><defs><marker id="em-arrowhead-eventmodeling-basic" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#333333"></polygon></marker></defs></svg>