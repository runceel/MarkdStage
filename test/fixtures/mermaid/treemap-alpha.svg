<svg id="treemap-alpha" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="2 27 996 371" style="max-width: 996px;" class="flowchart" role="graphics-document document" aria-roledescription="treemap"><style>#treemap-alpha{font-family:Arial;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#treemap-alpha .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#treemap-alpha .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#treemap-alpha .error-icon{fill:#552222;}#treemap-alpha .error-text{fill:#552222;stroke:#552222;}#treemap-alpha .edge-thickness-normal{stroke-width:1px;}#treemap-alpha .edge-thickness-thick{stroke-width:3.5px;}#treemap-alpha .edge-pattern-solid{stroke-dasharray:0;}#treemap-alpha .edge-thickness-invisible{stroke-width:0;fill:none;}#treemap-alpha .edge-pattern-dashed{stroke-dasharray:3;}#treemap-alpha .edge-pattern-dotted{stroke-dasharray:2;}#treemap-alpha .marker{fill:#333333;stroke:#333333;}#treemap-alpha .marker.cross{stroke:#333333;}#treemap-alpha svg{font-family:Arial;font-size:16px;}#treemap-alpha p{margin:0;}#treemap-alpha .treemapNode.section{stroke:black;stroke-width:1;fill:#efefef;}#treemap-alpha .treemapNode.leaf{stroke:black;stroke-width:1;fill:#efefef;}#treemap-alpha .treemapLabel{fill:#333;font-size:12px;}#treemap-alpha .treemapValue{fill:#333;font-size:10px;}#treemap-alpha .treemapTitle{fill:#333;font-size:14px;}#treemap-alpha .node .neo-node{stroke:#9370DB;}#treemap-alpha [data-look="neo"].node rect,#treemap-alpha [data-look="neo"].cluster rect,#treemap-alpha [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#treemap-alpha [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#treemap-alpha [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#treemap-alpha [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#treemap-alpha [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#treemap-alpha [data-look="neo"].node circle .state-start{fill:#000000;}#treemap-alpha [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#treemap-alpha [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#treemap-alpha .treemapLeafGroup.leaf0x .treemapLeaf{fill:rgba(10, 20, 30, 0.8);stroke:rgba(40, 50, 60, 0.6);fill-opacity:0.5;stroke-opacity:0.25;opacity:0.8;}#treemap-alpha :root{--mermaid-font-family:Arial;}</style><g></g><g transform="translate(0, 0)" class="treemapContainer"><g class="treemapSection" transform="translate(0,0)"><rect width="1000" height="25" class="treemapSectionHeader" fill="none" fill-opacity="0.6" stroke-width="0.6" style="display: none;"></rect><clipPath id="clip-section-treemap-alpha-0"><rect width="988" height="25"></rect></clipPath><rect width="1000" height="400" class="treemapSection section0" fill="transparent" fill-opacity="0.6" stroke="transparent" stroke-width="2" stroke-opacity="0.4" style="display: none;"></rect><text class="treemapSectionLabel" x="6" y="12.5" dominant-baseline="middle" font-weight="bold" style="display: none;"></text><text class="treemapSectionValue" x="990" y="12.5" text-anchor="end" dominant-baseline="middle" font-style="italic" style="display: none;">100</text></g><g class="treemapSection" transform="translate(10,35)"><rect width="980" height="25" class="treemapSectionHeader" fill="none" fill-opacity="0.6" stroke-width="0.6" style=""></rect><clipPath id="clip-section-treemap-alpha-1"><rect width="968" height="25"></rect></clipPath><rect width="980" height="355" class="treemapSection section1" fill="hsl(240, 100%, 76.2745098039%)" fill-opacity="0.6" stroke="hsl(240, 100%, 61.2745098039%)" stroke-width="2" stroke-opacity="0.4" style=";"></rect><text class="treemapSectionLabel" x="6" y="12.5" dominant-baseline="middle" font-weight="bold" style="dominant-baseline: middle; font-size: 12px; fill:#ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Independent alpha</text><text class="treemapSectionValue" x="970" y="12.5" text-anchor="end" dominant-baseline="middle" font-style="italic" style="text-anchor: end; dominant-baseline: middle; font-size: 10px; fill:#ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">100</text></g><g class="treemapNode treemapLeafGroup leaf0x" transform="translate(20,70)"><rect width="378" height="310" class="treemapLeaf" fill="hsl(240, 100%, 76.2745098039%)" style="" fill-opacity="0.3" stroke="hsl(240, 100%, 76.2745098039%)" stroke-width="3"></rect><clipPath id="clip-treemap-alpha-0"><rect width="374" height="306"></rect></clipPath><text class="treemapLabel" x="189" y="155" style="text-anchor: middle; dominant-baseline: middle; font-size: 38px;fill:black;" clip-path="url(#clip-treemap-alpha-0)">A</text><text class="treemapValue" x="189" y="176" style="text-anchor: middle; dominant-baseline: hanging; font-size: 23px; fill: black;" clip-path="url(#clip-treemap-alpha-0)">40</text></g><g class="treemapNode treemapLeafGroup leaf1x" transform="translate(408,70)"><rect width="281" height="310" class="treemapLeaf" fill="hsl(240, 100%, 76.2745098039%)" style="" fill-opacity="0.3" stroke="hsl(240, 100%, 76.2745098039%)" stroke-width="3"></rect><clipPath id="clip-treemap-alpha-1"><rect width="277" height="306"></rect></clipPath><text class="treemapLabel" x="140.5" y="155" style="text-anchor: middle; dominant-baseline: middle; font-size: 38px;fill:black;" clip-path="url(#clip-treemap-alpha-1)">B</text><text class="treemapValue" x="140.5" y="176" style="text-anchor: middle; dominant-baseline: hanging; font-size: 23px; fill: black;" clip-path="url(#clip-treemap-alpha-1)">30</text><