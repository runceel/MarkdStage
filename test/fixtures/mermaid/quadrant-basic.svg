<svg id="fixture-quadrant-basic" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 500px;" viewBox="0 0 500 500" role="graphics-document document" aria-roledescription="quadrantChart"><style>#fixture-quadrant-basic{font-family:Arial;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#fixture-quadrant-basic .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#fixture-quadrant-basic .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#fixture-quadrant-basic .error-icon{fill:#552222;}#fixture-quadrant-basic .error-text{fill:#552222;stroke:#552222;}#fixture-quadrant-basic .edge-thickness-normal{stroke-width:1px;}#fixture-quadrant-basic .edge-thickness-thick{stroke-width:3.5px;}#fixture-quadrant-basic .edge-pattern-solid{stroke-dasharray:0;}#fixture-quadrant-basic .edge-thickness-invisible{stroke-width:0;fill:none;}#fixture-quadrant-basic .edge-pattern-dashed{stroke-dasharray:3;}#fixture-quadrant-basic .edge-pattern-dotted{stroke-dasharray:2;}#fixture-quadrant-basic .marker{fill:#333333;stroke:#333333;}#fixture-quadrant-basic .marker.cross{stroke:#333333;}#fixture-quadrant-basic svg{font-family:Arial;font-size:16px;}#fixture-quadrant-basic p{margin:0;}#fixture-quadrant-basic .node .neo-node{stroke:#9370DB;}#fixture-quadrant-basic [data-look="neo"].node rect,#fixture-quadrant-basic [data-look="neo"].cluster rect,#fixture-quadrant-basic [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-quadrant-basic [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#fixture-quadrant-basic [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-quadrant-basic [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#fixture-quadrant-basic [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-quadrant-basic [data-look="neo"].node circle .state-start{fill:#000000;}#fixture-quadrant-basic [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-quadrant-basic [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-quadrant-basic :root{--mermaid-font-family:Arial;}</style><g></g><g class="main"><g class="quadrants"><g class="quadrant"><rect x="263" y="45" width="232" height="212" fill="#ECECFF"></rect><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 50) rotate(0)">Invest / 投資</text></g><g class="quadrant"><rect x="31" y="45" width="232" height="212" fill="#f1f1ff"></rect><text x="0" y="0" fill="#0e0e00" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 50) rotate(0)">Quick wins</text></g><g class="quadrant"><rect x="31" y="257" width="232" height="212" fill="#f6f6ff"></rect><text x="0" y="0" fill="#090900" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 262) rotate(0)">Hold / 保留</text></g><g class="quadrant"><rect x="263" y="257" width="232" height="212" fill="#fbfbff"></rect><text x="0" y="0" fill="#040400" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 262) rotate(0)">Review</text></g></g><g class="border"><line x1="30" y1="45" x2="496" y2="45" style="stroke: rgb(199, 199, 241); stroke-width: 2;"></line><line x1="495" y1="46" x2="495" y2="468" style="stroke: rgb(199, 199, 241); stroke-width: 2;"></line><line x1="30" y1="469" x2="496" y2="469" style="stroke: rgb(199, 199, 241); stroke-width: 2;"></line><line x1="31" y1="46" x2="31" y2="468" style="stroke: rgb(199, 199, 241); stroke-width: 2;"></line><line x1="263" y1="46" x2="263" y2="468" style="stroke: rgb(199, 199, 241); stroke-width: 1;"></line><line x1="32" y1="257" x2="494" y2="257" style="stroke: rgb(199, 199, 241); stroke-width: 1;"></line></g><g class="data-points"><g class="data-point"><circle cx="402.2" cy="384.20000000000005" r="8" fill="#9333ea" stroke="hsl(240, 100%, NaN%)" stroke-width="0px"></circle><text x="0" y="0" fill="#131300" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(402.2, 389.20000000000005) rotate(0)">Delta</text></g><g class="data-point"><circle cx="193.4" cy="363" r="5" fill="#f97316" stroke="hsl(240, 100%, NaN%)" stroke-width="0px"></circle><text x="0" y="0" fill="#131300" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(193.4, 368) rotate(0)">Gamma</text></g><g class="data-point"><circle cx="355.8" cy="214.60000000000002" r="6" fill="#16a34a" stroke="hsl(240, 100%, NaN%)" stroke-width="0px"></circle><text x="0" y="0" fill="#131300" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(355.8, 219.60000000000002) rotate(0)">Beta</text></g><g class="data-point"><circle cx="147" cy="151" r="7" fill="#2563eb" stroke="#102030" stroke-width="2px"></circle><text x="0" y="0" fill="#131300" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 156) rotate(0)">Alpha</text></g></g><g class="labels"><g class="label"><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 479) rotate(0)">Low effort</text></g><g class="label"><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 479) rotate(0)">High effort</text></g><g class="label"><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 363) rotate(-90)">Low value</text></g><g class="label"><text x="0" y="0" fill="#13130