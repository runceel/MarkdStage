le{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#journey-hybrid [data-look="neo"].node circle .state-start{fill:#000000;}#journey-hybrid [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#journey-hybrid [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#journey-hybrid :root{--mermaid-font-family:Arial;}</style><g></g><defs><marker id="journey-hybrid-arrowhead" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto"><path d="M 0,0 V 4 L6,2 Z"></path></marker></defs><circle cx="20" cy="60" class="actor-0" fill="#8FBC8F" stroke="#000" r="7"></circle><text x="40" y="67" class="legend"><tspan x="50">利用者</tspan></text><circle cx="20" cy="80" class="actor-1" fill="#7CFC00" stroke="#000" r="7"></circle><text x="40" y="87" class="legend"><tspan x="50">担当者</tspan></text><g><rect x="150" y="50" fill="#191970" stroke="#666" width="350" height="50" rx="3" ry="3" class="journey-section section-type-0"></rect><switch><foreignObject x="150" y="50" width="350" height="50" position="fixed"><div class="journey-section section-type-0" xmlns="http://www.w3.org/1999/xhtml" style="display: table; height: 100%; width: 100%;"><div class="label" style="display: table-cell; text-align: center; vertical-align: middle;">開始</div></div></foreignObject><text x="325" y="75" dominant-baseline="central" alignment-baseline="central" class="journey-section section-type-0" style="text-anchor: middle; font-size: 14px; font-family: &quot;Open Sans&quot;, sans-serif;"><tspan x="325" dy="0">開始</tspan></text></switch></g><g><line id="journey-hybrid-task0" x1="225" y1="110" x2="225" y2="450" class="task-line" stroke-width="1px" stroke-dasharray="4 2" stroke="#666"></line><circle cx="225" cy="300" class="face" r="15" stroke-width="2" overflow="visible"></circle><g><circle cx="220" cy="295" r="1.5" stroke-width="2" fill="#666" stroke="#666"></circle><circle cx