<svg id="journey-hybrid" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 900px;" viewBox="0 -25 900 540" preserveAspectRatio="xMinYMin meet" height="565" role="graphics-document document" aria-roledescription="journey"><style>#journey-hybrid{font-family:Arial;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#journey-hybrid .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#journey-hybrid .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#journey-hybrid .error-icon{fill:#552222;}#journey-hybrid .error-text{fill:#552222;stroke:#552222;}#journey-hybrid .edge-thickness-normal{stroke-width:1px;}#journey-hybrid .edge-thickness-thick{stroke-width:3.5px;}#journey-hybrid .edge-pattern-solid{stroke-dasharray:0;}#journey-hybrid .edge-thickness-invisible{stroke-width:0;fill:none;}#journey-hybrid .edge-pattern-dashed{stroke-dasharray:3;}#journey-hybrid .edge-pattern-dotted{stroke-dasharray:2;}#journey-hybrid .marker{fill:#333333;stroke:#333333;}#journey-hybrid .marker.cross{stroke:#333333;}#journey-hybrid svg{font-family:Arial;font-size:16px;}#journey-hybrid p{margin:0;}#journey-hybrid .label{font-family:Arial;color:#333;}#journey-hybrid .mouth{stroke:#666;}#journey-hybrid line{stroke:#333;}#journey-hybrid .legend{fill:#333;font-family:Arial;}#journey-hybrid .label text{fill:#333;}#journey-hybrid .label{color:#333;}#journey-hybrid .face{fill:#FFF8DC;stroke:#999;}#journey-hybrid .node rect,#journey-hybrid .node circle,#journey-hybrid .node ellipse,#journey-hybrid .node polygon,#journey-hybrid .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#journey-hybrid .node .label{text-align:center;}#journey-hybrid .node.clickable{cursor:pointer;}#journey-hybrid .arrowheadPath{fill:#333333;}#journey-hybrid .edgePath .path{stroke:#3