<svg id="fixture-xychart-basic" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 700px;" viewBox="0 0 700 500" role="graphics-document document" aria-roledescription="xychart"><style>#fixture-xychart-basic{font-family:Arial;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#fixture-xychart-basic .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#fixture-xychart-basic .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#fixture-xychart-basic .error-icon{fill:#552222;}#fixture-xychart-basic .error-text{fill:#552222;stroke:#552222;}#fixture-xychart-basic .edge-thickness-normal{stroke-width:1px;}#fixture-xychart-basic .edge-thickness-thick{stroke-width:3.5px;}#fixture-xychart-basic .edge-pattern-solid{stroke-dasharray:0;}#fixture-xychart-basic .edge-thickness-invisible{stroke-width:0;fill:none;}#fixture-xychart-basic .edge-pattern-dashed{stroke-dasharray:3;}#fixture-xychart-basic .edge-pattern-dotted{stroke-dasharray:2;}#fixture-xychart-basic .marker{fill:#333333;stroke:#333333;}#fixture-xychart-basic .marker.cross{stroke:#333333;}#fixture-xychart-basic svg{font-family:Arial;font-size:16px;}#fixture-xychart-basic p{margin:0;}#fixture-xychart-basic .node .neo-node{stroke:#9370DB;}#fixture-xychart-basic [data-look="neo"].node rect,#fixture-xychart-basic [data-look="neo"].cluster rect,#fixture-xychart-basic [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-xychart-basic [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#fixture-xychart-basic [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-xychart-basic [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#fixture-xychart-basic [data-look="n