<svg id="fixture-rotated-text" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 700px;" viewBox="0 0 700 500" role="graphics-document document" aria-roledescription="xychart"><style>#fixture-rotated-text{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#fixture-rotated-text .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#fixture-rotated-text .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#fixture-rotated-text .error-icon{fill:#552222;}#fixture-rotated-text .error-text{fill:#552222;stroke:#552222;}#fixture-rotated-text .edge-thickness-normal{stroke-width:1px;}#fixture-rotated-text .edge-thickness-thick{stroke-width:3.5px;}#fixture-rotated-text .edge-pattern-solid{stroke-dasharray:0;}#fixture-rotated-text .edge-thickness-invisible{stroke-width:0;fill:none;}#fixture-rotated-text .edge-pattern-dashed{stroke-dasharray:3;}#fixture-rotated-text .edge-pattern-dotted{stroke-dasharray:2;}#fixture-rotated-text .marker{fill:#333333;stroke:#333333;}#fixture-rotated-text .marker.cross{stroke:#333333;}#fixture-rotated-text svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#fixture-rotated-text p{margin:0;}#fixture-rotated-text .node .neo-node{stroke:#9370DB;}#fixture-rotated-text [data-look="neo"].node rect,#fixture-rotated-text [data-look="neo"].cluster rect,#fixture-rotated-text [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-rotated-text [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#fixture-rotated-text [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-rotated-text [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#fixture-rotated-text [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-rotated-text [data-look="neo"].node circle .state-start{fill:#000000;}#fixture-rotated-text [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-rotated-text [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-rotated-text :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g class="main"><rect width="700" height="500" class="background" fill="white"></rect><g class="chart-title"><text x="0" y="0" fill="#131300" font-size="20" dominant-baseline="middle" text-anchor="middle" transform="translate(350, 21.5) rotate(0)">Quarterly revenue</text></g><g class="plot"><g class="bar-plot-0"><rect x="71.33359375" y="357" width="100.69999999999999" height="110" fill="#ECECFF" stroke="#ECECFF" stroke-width="0"></rect><rect x="246.4390625" y="255" width="100.69999999999999" height="212" fill="#ECECFF" stroke="#ECECFF" stroke-width="0"></rect><rect x="421.54453125" y="153" width="100.69999999999999" height="314" fill="#ECECFF" stroke="#ECECFF" stroke-width="0"></rect><rect x="596.65" y="51" width="100.69999999999999" height="416" fill="#ECECFF" stroke="#ECECFF" stroke-width="0"></rect></g></g><g class="bottom-axis"><g class="axis-line"><path d="M 68.68359375,468 L 700,468" fill="none" stroke="#131300" stroke-width="2"></path></g><g class="label"><text x="0" y="0" fill="#131300" font-size="14" dominant-baseline="text-before-edge" text-anchor="middle" transform="translate(121.68359375, 479) rotate(0)">Q1</text><text x="0" y="0" fill="#131300" font-size="14" dominant-baseline="text-before-edge" text-anchor="middle" transform="translate(296.7890625, 479) rotate(0)">Q2</text><text x="0" y="0" fill="#131300" font-size="14" dominant-baseline="text-before-edge" text-anchor="middle" transf